<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポリクリ メモ追加</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0071e3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ポリクリメモ" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="container">
    <h1>📋 ポリクリ メモ追加</h1>

    <form id="task-form">

      <div class="field">
        <label for="name">タイトル <span class="required">*</span></label>
        <input type="text" id="name" placeholder="例：川崎病の診断基準" required />
      </div>

      <div class="field">
        <label for="dept">診療科</label>
        <select id="dept">
          <option value="">読み込み中…</option>
        </select>
      </div>

      <div class="field">
        <label for="memo">実習メモ</label>
        <textarea id="memo" rows="3" placeholder="実習中に気になったこと"></textarea>
      </div>

      <div class="field">
        <label for="report">レポート考察</label>
        <textarea id="report" rows="3" placeholder="レポートに使いたい内容"></textarea>
      </div>

      <div class="field">
        <label for="cbt">CBT知識</label>
        <textarea id="cbt" rows="3" placeholder="CBT・国試に関連する知識"></textarea>
      </div>

      <div class="field">
        <label for="date">作成日時</label>
        <input type="date" id="date" />
      </div>

      <button type="submit" id="submit-btn">Notionに追加する</button>

    </form>

    <div id="toast" class="toast"></div>
  </div>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
